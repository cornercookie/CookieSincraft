[package]
name = "cookie-sincraft"
version = "0.2.0"
description = "CookieSincraft Tauri 2 Project"
authors = ["You"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta", features = ["tray-icon", "wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24", features = ["png", "jpeg", "gif", "pnm", "tiff", "bmp", "ico", "hdr"] }
image-webp = "0.2.4"
fast_image_resize = "0.7"
wgpu = { version = "0.19", features = ["dx12", "vulkan-portability"] }
bytemuck = { version = "1.14", features = ["derive"] }
rfd = "0.13"
same-file = "1.0.6"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
fastrand = "2.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"

[dev-dependencies]
# WGSL front-end (naga 0.19, matching wgpu 0.19) used by the shader parse test
# in gpu.rs / integration tests: every include_str! WGSL must parse cleanly.
naga = { version = "0.19.2", features = ["wgsl-in"] }
